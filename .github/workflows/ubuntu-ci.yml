name: Ubuntu CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    name: GCC / Qt 6
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ libeigen3-dev libgtest-dev \
            nlohmann-json3-dev libcurl4-openssl-dev libproj-dev libopenjp2-7-dev \
            libpng-dev libaec-dev libjpeg-dev \
            qt6-base-dev qt6-declarative-dev qt6-quick3d-dev qt6-charts-dev \
            qt6-shadertools-dev qml6-module-qt5compat-graphicaleffects \
            qml6-module-qtcharts qml6-module-qtcore qml6-module-qtqml \
            qml6-module-qtqml-models qml6-module-qtqml-workerscript \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qtquick3d qml6-module-qtquick3d-helpers \
            qt6-wayland qt6-svg-plugins patchelf xvfb xauth 7zip zip

      - name: Identify runner image
        id: runner-image
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore GDAL cache
        id: gdal-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/trajecta-gdal
          key: ubuntu-gdal-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ hashFiles('installer/linux/build-gdal.sh') }}

      - name: Build minimal GDAL
        if: steps.gdal-cache.outputs.cache-hit != 'true'
        run: bash installer/linux/build-gdal.sh "$RUNNER_TEMP/trajecta-gdal"

      - name: Save GDAL cache
        if: steps.gdal-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/trajecta-gdal
          key: ${{ steps.gdal-cache.outputs.cache-primary-key }}

      - name: Restore runtime data
        id: runtime-data
        uses: actions/cache/restore@v4
        with:
          path: |
            data/linux_p1550p2650.440
            data/debias/efcc18.dat
            data/debias/fcct14.dat
          key: ubuntu-runtime-data-de440-efcc18-fcct14-v1

      - name: Prepare and verify runtime data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/debias
          if [[ ! -f data/linux_p1550p2650.440 ]]; then
            curl --fail --location --retry 3 -o data/linux_p1550p2650.440 \
              https://ssd.jpl.nasa.gov/ftp/eph/planets/Linux/de440/linux_p1550p2650.440
          fi
          printf '%s  %s\n' 29915576d0a6555766b99485ac3056ee415e86df4fce282611c31afb329ad062 data/linux_p1550p2650.440 | sha256sum -c -
          for pair in '2014 fcct14.dat 3ad243953731218565cbb25937e87803165ac28e4c948f06e52c6f8b9e1af887' \
                      '2018 efcc18.dat ef6a50830bb83d8b1161e7acb391eed988ea9708e9fbcccc0c834da6109476e3'; do
            read -r year file hash <<< "$pair"
            if [[ ! -f data/debias/$file ]]; then
              curl --fail --location --retry 3 -o "$RUNNER_TEMP/debias.tgz" "https://ssd.jpl.nasa.gov/ftp/ssd/debias/debias_${year}.tgz"
              tar -xOzf "$RUNNER_TEMP/debias.tgz" bias.dat > "data/debias/$file"
            fi
            printf '%s  %s\n' "$hash" "data/debias/$file" | sha256sum -c -
          done

      - name: Save runtime data cache
        if: steps.runtime-data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/linux_p1550p2650.440
            data/debias/efcc18.dat
            data/debias/fcct14.dat
          key: ${{ steps.runtime-data.outputs.cache-primary-key }}

      - name: Configure
        run: >-
          cmake -S . -B build/ubuntu -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=/usr -DGDAL_DIR="$RUNNER_TEMP/trajecta-gdal/lib/cmake/gdal"

      - name: Build
        run: cmake --build build/ubuntu --parallel 4

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: ctest --test-dir build/ubuntu --output-on-failure --no-tests=error --parallel 2

      - name: Install packaging tools
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ifw" "$RUNNER_TEMP/linuxdeploy"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ifw.7z" \
            https://download.qt.io/online/qtsdkrepository/linux_x64/ifw/tools_ifw_411/qt.tools.ifw.411/4.11.0-0-202603231357ifw-linux-x64.7z
          echo '79ef906970c7e4be9ec15447fd5acb0a8ae2ab41aef5f9184086ce3972eddbc7  '"$RUNNER_TEMP/ifw.7z" | sha256sum -c -
          7z x -y "-o$RUNNER_TEMP/ifw" "$RUNNER_TEMP/ifw.7z" > /dev/null
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/linuxdeploy/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/linuxdeploy/linuxdeploy-plugin-qt-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          echo 'df908b19f1ed1cdafa79508d415aa12d6c56ce4d56d4149aa8c09286718706e5  '"$RUNNER_TEMP/linuxdeploy/linuxdeploy-x86_64.AppImage" | sha256sum -c -
          echo 'cfc1055b2b9dbc08412b579f20990b7b41a17b61beaa5847dc9477c96c9e9617  '"$RUNNER_TEMP/linuxdeploy/linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/ifw/bin/"* "$RUNNER_TEMP/linuxdeploy/"*.AppImage

      - name: Test maintenance tool update and removal
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: bash installer/linux/update-smoke.sh "$RUNNER_TEMP/ifw"

      - name: Build Linux installer and update repository
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(tr -d '\r\n' < build/ubuntu/TrajectaUI/trajecta-version.txt)
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo 'Release tag and application version differ' >&2; exit 1; }
          fi
          bash installer/linux/deploy.sh build/ubuntu "$RUNNER_TEMP/ifw" \
            "$RUNNER_TEMP/linuxdeploy/linuxdeploy-x86_64.AppImage" "$RUNNER_TEMP/linux-release" \
            "" "$RUNNER_TEMP/trajecta-gdal/share/gdal"

      - name: Test installer and installed application
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: >-
          bash installer/linux/install-smoke.sh "$RUNNER_TEMP/linux-release/TrajectaSetup-x86_64.run"
          build/ubuntu/StrewnField/StrewnCoreTests

      - name: Archive update repository
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(tr -d '\r\n' < build/ubuntu/TrajectaUI/trajecta-version.txt)
          cd "$RUNNER_TEMP/linux-release/repository"
          zip -0 -qr "$RUNNER_TEMP/linux-release/Trajecta-IFW-linux-x86_64-v${version}.zip" .

      - name: Upload Linux release packages
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-packages
          path: |
            ${{ runner.temp }}/linux-release/TrajectaSetup-x86_64.run
            ${{ runner.temp }}/linux-release/Trajecta-IFW-linux-x86_64-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-test-logs
          path: |
            build/ubuntu/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
