name: Publish application updates

on:
  push:
    branches: [master]
    paths:
      - 'wiki/**'
      - 'TrajectaUI/resources/icons/workspace/app-logo.svg'
      - '.github/workflows/publish-updates.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release tag
        required: true
        type: string

concurrency:
  group: trajecta-update-publication
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check documentation availability
        id: documentation
        shell: bash
        run: |
          if [[ -d wiki ]]; then
            test -f wiki/package-lock.json || { echo 'Documentation lockfile is missing.'; exit 1; }
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Documentation is not present in the default branch; publishing updates only.'
          fi

      - name: Set up Node.js
        if: steps.documentation.outputs.available == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: wiki/package-lock.json

      - name: Build documentation
        if: steps.documentation.outputs.available == 'true'
        working-directory: wiki
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare update repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $latest = gh release view --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $latest.tagName) { throw 'Failed to find the latest release.' }
          if (-not $env:RELEASE_TAG -and $env:GITHUB_EVENT_NAME -eq 'push') {
            $env:RELEASE_TAG = $latest.tagName
          }
          if ($env:RELEASE_TAG -cnotmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag.' }
          if ($latest.tagName -cne $env:RELEASE_TAG) {
            throw 'The published release is not the latest stable release; refusing to replace the update repository.'
          }
          $releases = gh api "repos/$env:GH_REPO/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Failed to list releases.' }
          $current = @($releases | Where-Object { $_.tag_name -ceq $env:RELEASE_TAG })
          if ($current.Count -ne 1 -or $current[0].draft -or $current[0].prerelease) {
            throw 'A published stable release is required.'
          }
          $site = Join-Path $env:RUNNER_TEMP 'trajecta-pages'
          $downloads = Join-Path $env:RUNNER_TEMP 'trajecta-update-downloads'
          New-Item -ItemType Directory -Path $site, $downloads -Force | Out-Null
          $platforms = @(
            @{ Name = 'windows'; Prefixes = @('Trajecta-IFW-windows-x86_64-', 'Trajecta-IFW-'); Required = $true },
            @{ Name = 'linux'; Prefixes = @('Trajecta-IFW-linux-x86_64-'); Required = $false }
          )
          foreach ($platform in $platforms) {
            $available = @($releases | Where-Object {
              $release = $_
              -not $release.draft -and -not $release.prerelease -and $release.tag_name -cmatch '^v\d+\.\d+\.\d+$' -and
                @($platform.Prefixes | Where-Object {
                  $archiveName = "$_$($release.tag_name).zip"
                  @($release.assets | Where-Object { $_.name -ceq $archiveName }).Count -gt 0
                }).Count -gt 0
            } | Sort-Object published_at -Descending | Select-Object -First 2)
            if ($platform.Required -and ($available.Count -eq 0 -or $available[0].tag_name -cne $env:RELEASE_TAG)) {
              throw "The latest release is missing the $($platform.Name) update repository."
            }
            if ($available.Count -eq 0) { continue }
            $repository = Join-Path $site "updates/$($platform.Name)"
            New-Item -ItemType Directory -Path $repository -Force | Out-Null
            [array]::Reverse($available)
            foreach ($release in $available) {
              $prefix = @($platform.Prefixes | Where-Object {
                $archiveName = "$_$($release.tag_name).zip"
                @($release.assets | Where-Object { $_.name -ceq $archiveName }).Count -gt 0
              } | Select-Object -First 1)[0]
              $archive = "$prefix$($release.tag_name).zip"
              gh release download "$($release.tag_name)" --pattern "$archive" --dir "$downloads"
              if ($LASTEXITCODE -ne 0) { throw "Missing update repository asset: $archive." }
              Expand-Archive -LiteralPath (Join-Path $downloads $archive) -DestinationPath $repository -Force
            }
            [xml]$updates = Get-Content -LiteralPath (Join-Path $repository 'Updates.xml') -Raw
            $components = @($updates.Updates.PackageUpdate | Where-Object { $_.Name -ceq 'com.trajecta.app' })
            $newestTag = $available[-1].tag_name
            if ($components.Count -ne 1 -or $components[0].Version -cne $newestTag.Substring(1)) {
              throw "The $($platform.Name) component version does not match $newestTag."
            }
          }
          Set-Content -LiteralPath (Join-Path $site 'index.html') -Value '<!doctype html><title>Trajecta updates</title>' -Encoding utf8

      - name: Add documentation to Pages
        if: steps.documentation.outputs.available == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $site = Join-Path $env:RUNNER_TEMP 'trajecta-pages'
          $documentation = Join-Path $env:GITHUB_WORKSPACE 'wiki/dist'
          if (-not (Test-Path -LiteralPath (Join-Path $documentation 'index.html'))) {
            throw 'Built documentation is missing.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $site 'updates/windows/Updates.xml'))) {
            throw 'Windows update repository is missing.'
          }
          $destination = Join-Path $site 'docs'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item -Path (Join-Path $documentation '*') -Destination $destination -Recurse -Force

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/trajecta-pages
      - name: Deploy updates
        id: deployment
        uses: actions/deploy-pages@v4
